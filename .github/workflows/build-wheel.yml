name: Build Windows Wheel

on:
  workflow_dispatch:  # اجرای دستی از تب Actions
  push:
    tags:
      - 'v*'  # (اختیاری) اجرای خودکار هنگام ایجاد تگ نسخه

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: |
          Get-ChildItem dist\
          python -c "import zipfile,glob; [print(zipfile.ZipFile(f).namelist()[:10]) for f in glob.glob('dist/*.whl')]"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawcodex-wheel-windows-py311
          path: dist/*.whl
          retention-days: 30
