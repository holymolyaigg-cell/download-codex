name: Build ClawCodex Wheel

on:
  workflow_dispatch:  # اجرای دستی از تب Actions

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Clone ClawCodex source code
        run: |
          git clone https://github.com/agentforce314/clawcodex.git source
          cd source
          git log -1 --oneline

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip and install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build wheel
        working-directory: source
        run: python -m build --wheel

      - name: Show built files
        working-directory: source
        run: Get-ChildItem dist\

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawcodex-wheel-windows-py311
          path: source/dist/*.whl
          retention-days: 30
